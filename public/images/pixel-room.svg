  <title id="title">窗外下雪的奶油粉像素小窝</title>
  <desc id="description">原创像素插画。暖粉墙纸的房间里有星星串灯、雪景窗户、粉色沙发和抱枕、木书桌上的电脑与书、盆栽、台灯、茶杯，以及趴在地毯上的小猫。</desc>

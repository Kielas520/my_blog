<svg xmlns="http://www.w3.org/2000/svg" width="720" height="448" viewBox="0 0 720 448" shape-rendering="crispEdges" role="img" aria-labelledby="title description">
  <title id="title">面包香里的秋日下午像素厨房</title>
  <desc id="description">原创像素插画。窗外金橙色树叶映着秋日阳光，暖木厨房里摆着炉具、冒热气的茶壶、刚烤好的面包、烘焙用具和香草。格纹餐桌上有茶杯和南瓜，棕白小狗睡在编织垫上。</desc>
